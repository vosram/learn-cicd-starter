name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"

      - name: Install Goose for migrations
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Run build script
        run: ./scripts/buildprod.sh

      - name: Migrate Database
        run: ./scripts/migrateup.sh

      - id: "auth"
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and push to GAR
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-508014/notely-ar-repo/notely:latest .

      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/notely-508014/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project notely-508014 --max-instances=4
